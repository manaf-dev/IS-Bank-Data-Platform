# Name lists for the world simulator, ordered roughly from most to least common
# (sampling weight comes from rank; see customers.names.popularity_exponent in config.yaml).
# These are common given names and family names, composed randomly: no combination is
# intended to describe a real person.

# Akan day names, indexed by birth weekday: Sunday first.
akan_day_names:
  male: [Kwesi, Kwadwo, Kwabena, Kwaku, Yaw, Kofi, Kwame]
  female: [Akosua, Adwoa, Abena, Akua, Yaa, Afua, Ama]

# Given names shared across groups (mostly Christian/English usage).
common_given:
  male: [Emmanuel, Daniel, Samuel, Michael, Isaac, Joseph, Richard, Eric, Prince, Ebenezer,
         Francis, Kingsley, Godfred, Stephen, Benjamin, Charles, George, Joshua, Bernard, Felix]
  female: [Grace, Mercy, Esther, Comfort, Gifty, Patience, Felicia, Joyce, Priscilla, Vida,
           Abigail, Elizabeth, Linda, Rita, Rebecca, Sarah, Victoria, Doris, Juliana, Agnes]

groups:
