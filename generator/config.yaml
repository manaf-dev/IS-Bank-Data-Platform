# Single source of truth for every generator rate, fraction, noise level, and date window.
# Nothing in generator code may hardcode these values.
#
# Reference data below (branches, segments, products) is a DRAFT for review: see ADR-0002.
# All names are fictional; incomes are rough, illustrative GHS figures, not market data.

seed: 20261019

simulation:
  # Three full calendar years, so each year has its own Christmas, Easter, and
  # school-fees season. After `today`, daily ticks continue from the next day.
  start_date: 2023-01-01
  today: 2025-12-31
  currency: GHS

# Select with --profile (default: dev). Profiles override the base values above.
profiles:
  dev:
    customers: 2000
  full:
    customers: 50000

# ---------------------------------------------------------------- branches
