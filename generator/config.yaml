# ---------------------------------------------------------------- customer segments
# Bank-wide archetype mix (sums to 1); branches may override it above.
# monthly_income_ghs: lognormal median and sigma, before the branch income_index is applied.
#   For `sme` this is monthly business turnover rather than personal income.
# income_regularity: 1.0 = same amount on a fixed pay day; lower = more irregular inflows.
# cash_intensity:    share of activity done in cash at the branch rather than electronically.
segments:
  mix:
    civil_servant: 0.20
    corporate_employee: 0.22
    market_trader: 0.28
    susu_saver: 0.18
    sme: 0.12
  archetypes:
    civil_servant:
      customer_type: individual
      monthly_income_ghs: { median: 3500, sigma: 0.35 }
      income_regularity: 0.95
      cash_intensity: 0.25
    corporate_employee:
      customer_type: individual
      monthly_income_ghs: { median: 5500, sigma: 0.55 }
      income_regularity: 0.95
      cash_intensity: 0.15
    market_trader:
      customer_type: individual
      monthly_income_ghs: { median: 2800, sigma: 0.80 }
      income_regularity: 0.30
      cash_intensity: 0.70
    susu_saver:
      customer_type: individual
      monthly_income_ghs: { median: 1500, sigma: 0.60 }
      income_regularity: 0.50
      cash_intensity: 0.75
    sme:
      customer_type: business
      monthly_income_ghs: { median: 30000, sigma: 1.00 }
      income_regularity: 0.40
      cash_intensity: 0.45

# ---------------------------------------------------------------- products
# take_up:      probability a customer of that segment holds the product at some point.
#               Segments not listed are not eligible.
# requires_any: the product can only be held alongside one of these (e.g. a card needs an
#               account to draw from); the earliest such account becomes its linked account.
# terms:        contract amount as a lognormal multiple of monthly income, tenor, and an
#               annual rate drawn uniformly from [min, max]. Illustrative figures only.
products:
  # Deposits
  - product_code: CA_PER
    name: Personal Current Account
    family: deposit
    take_up: { civil_servant: 0.90, corporate_employee: 0.95, market_trader: 0.55, susu_saver: 0.20 }
  - product_code: CA_BIZ
    name: Business Current Account
    family: deposit
    take_up: { market_trader: 0.15, sme: 1.00 }
  - product_code: SA_REG
    name: Regular Savings Account
    family: deposit
    take_up: { civil_servant: 0.55, corporate_employee: 0.60, market_trader: 0.50, susu_saver: 0.40 }
  - product_code: SA_SUSU
    name: Susu Savings Account
    family: deposit
    take_up: { market_trader: 0.30, susu_saver: 0.95 }
  - product_code: FD_TERM
    name: Fixed Deposit (3/6/12 months)
    family: deposit
    take_up: { civil_servant: 0.10, corporate_employee: 0.18, market_trader: 0.05, sme: 0.20 }
    requires_any: [CA_PER, SA_REG, CA_BIZ]
    terms:
      amount_income_multiple: { median: 2.0, sigma: 0.8 }
      term_months: { values: [3, 6, 12], weights: [0.4, 0.3, 0.3] }
      annual_rate_pct: { min: 16, max: 24 }
  # Cards
  - product_code: DC_DEBIT
    name: Debit Card
    family: card
    take_up: { civil_servant: 0.80, corporate_employee: 0.92, market_trader: 0.40, susu_saver: 0.15, sme: 0.50 }
    requires_any: [CA_PER, SA_REG, SA_SUSU, CA_BIZ]
  - product_code: CC_CLASSIC
    name: Classic Credit Card
    family: card
    take_up: { civil_servant: 0.04, corporate_employee: 0.12, sme: 0.05 }
    requires_any: [CA_PER, CA_BIZ]
    terms:
      # For a credit card the contract amount is the credit limit.
      amount_income_multiple: { median: 1.0, sigma: 0.4 }
      annual_rate_pct: { min: 30, max: 42 }
  # Lending
  - product_code: LN_PERS
    name: Personal Loan
    family: loan
    take_up: { civil_servant: 0.30, corporate_employee: 0.22 }
    requires_any: [CA_PER]
    terms:
      amount_income_multiple: { median: 6.0, sigma: 0.5 }
      term_months: { values: [12, 24, 36, 48], weights: [0.2, 0.35, 0.3, 0.15] }
      annual_rate_pct: { min: 26, max: 34 }
  - product_code: LN_SALADV
    name: Salary Advance
    family: loan
    take_up: { civil_servant: 0.20, corporate_employee: 0.15 }
    requires_any: [CA_PER]
    terms:
      amount_income_multiple: { median: 0.5, sigma: 0.3 }
      term_months: { values: [1, 2, 3], weights: [0.5, 0.3, 0.2] }
      annual_rate_pct: { min: 30, max: 40 }
  - product_code: LN_MICRO
    name: Trader Micro Loan
    family: loan
    take_up: { market_trader: 0.25, susu_saver: 0.10 }
    requires_any: [CA_PER, SA_REG, SA_SUSU, CA_BIZ]
    terms:
      amount_income_multiple: { median: 1.5, sigma: 0.6 }
      term_months: { values: [3, 6, 12], weights: [0.3, 0.4, 0.3] }
      annual_rate_pct: { min: 36, max: 48 }
  - product_code: LN_SME_WC
    name: SME Working Capital Loan
    family: loan
    take_up: { sme: 0.40 }
    requires_any: [CA_BIZ]
    terms:
      # Multiple of monthly business turnover.
      amount_income_multiple: { median: 1.2, sigma: 0.7 }
      term_months: { values: [6, 12, 18, 24], weights: [0.25, 0.35, 0.2, 0.2] }
      annual_rate_pct: { min: 28, max: 36 }

# Services attached to a customer rather than an account. Take-up is scaled by the home
# branch's digital_index (capped at 1).
services:
  mobile_banking: { civil_servant: 0.60, corporate_employee: 0.80, market_trader: 0.45, susu_saver: 0.25, sme: 0.70 }
  momo_wallet_link: { civil_servant: 0.55, corporate_employee: 0.65, market_trader: 0.70, susu_saver: 0.50, sme: 0.60 }

# ---------------------------------------------------------------- holdings
holdings:
  # Mobile money wallets registered on the customer's own phone number (else another line).
  momo_same_number_share: 0.85
  # Loan principals, deposit amounts, and credit limits are rounded to this many cedis.
  contract_amount_rounding_ghs: 50
  # Cards, loans, and fixed deposits open no earlier than this many months before
  # start_date, so the pre-window book is recent and most contracts are live in the window.
  dependent_open_lookback_months: 24

# ---------------------------------------------------------------- merchants
merchants:
  per_1000_customers: 40
  # Share of a customer's card purchases made at merchants in their home branch's city.
  local_share: 0.85
  # channel: where the category trades (pos, online, or both).
  categories:
    grocery: { mcc: "5411", weight: 0.22, channel: pos, label: Supermarket }
    fuel: { mcc: "5541", weight: 0.12, channel: pos, label: Filling Station }
    restaurant: { mcc: "5812", weight: 0.12, channel: pos, label: Restaurant }
    pharmacy: { mcc: "5912", weight: 0.08, channel: pos, label: Pharmacy }
    clothing: { mcc: "5651", weight: 0.08, channel: both, label: Fashion House }
    electronics: { mcc: "5732", weight: 0.06, channel: both, label: Electronics }
    hardware: { mcc: "5251", weight: 0.06, channel: pos, label: Hardware }
    airtime_data: { mcc: "4814", weight: 0.10, channel: online, label: Telecom Top-Up }
    betting: { mcc: "7995", weight: 0.06, channel: online, label: Sports Betting }
    travel: { mcc: "4722", weight: 0.04, channel: online, label: Travel Agency }
    hotel: { mcc: "7011", weight: 0.03, channel: both, label: Hotel }
    education: { mcc: "8220", weight: 0.03, channel: both, label: School }

# ---------------------------------------------------------------- behaviour
# Monthly money flows. Inflows and spending are expressed relative to monthly income, so
# balances stay plausible at any income level. Declined debits (insufficient funds) are
# kept with status DECLINED; they become card-switch response codes and missed payments.
behaviour:
  # Per-customer multiplier on discretionary event counts (lognormal), plus a dormant share.
  activity: { median: 0.8, sigma: 0.5, dormant_share: 0.10, dormant_multiplier: 0.05 }
  # Balance held at start_date by accounts opened before the window, as income multiple.
  opening_balance_income_multiple: { median: 1.2, sigma: 0.7 }
  # Share of a month's expected income a customer spends (truncated normal per customer).
  spend_ratio: { mean: 0.88, sd: 0.07, min: 0.5, max: 1.0 }
  # Month-to-month variation of salary and business income.
  income_noise_sd: 0.05
  # Pay day range per salaried segment (one fixed day per customer, clamped to month end).
  salary_day:
    civil_servant: { min: 20, max: 25 }
    corporate_employee: { min: 25, max: 31 }
  # Non-salaried segments receive income as several irregular inflows (Poisson mean/month).
  irregular_inflows:
    market_trader: { events: 2, channels: { BRANCH_CASH_DEPOSIT: 0.6, MOMO_TO_BANK: 0.3, TRANSFER_IN: 0.1 } }
    susu_saver: { events: 3, channels: { BRANCH_CASH_DEPOSIT: 0.8, MOMO_TO_BANK: 0.2 } }
    sme: { events: 3, channels: { BRANCH_CASH_DEPOSIT: 0.4, MOMO_TO_BANK: 0.2, TRANSFER_IN: 0.4 } }
  # Discretionary debits: Poisson mean per month and channel mix per segment. Channels the
  # customer can't use yet (no card, no MoMo link, no mobile banking) fall back to branch.
  spending:
    civil_servant:
      events: 3
      channels: { ATM_WITHDRAWAL: 0.30, BRANCH_WITHDRAWAL: 0.10, POS_PURCHASE: 0.20, ONLINE_PURCHASE: 0.05, BANK_TO_MOMO: 0.20, TRANSFER_OUT: 0.05, BILL_PAYMENT: 0.10 }
    corporate_employee:
      events: 4
      channels: { ATM_WITHDRAWAL: 0.20, BRANCH_WITHDRAWAL: 0.05, POS_PURCHASE: 0.30, ONLINE_PURCHASE: 0.12, BANK_TO_MOMO: 0.15, TRANSFER_OUT: 0.08, BILL_PAYMENT: 0.10 }
    market_trader:
      events: 2
      channels: { ATM_WITHDRAWAL: 0.15, BRANCH_WITHDRAWAL: 0.40, POS_PURCHASE: 0.05, ONLINE_PURCHASE: 0.02, BANK_TO_MOMO: 0.30, TRANSFER_OUT: 0.05, BILL_PAYMENT: 0.03 }
    susu_saver:
      events: 1
      channels: { ATM_WITHDRAWAL: 0.10, BRANCH_WITHDRAWAL: 0.60, POS_PURCHASE: 0.02, ONLINE_PURCHASE: 0.01, BANK_TO_MOMO: 0.25, TRANSFER_OUT: 0.01, BILL_PAYMENT: 0.01 }
    sme:
      events: 4
      channels: { ATM_WITHDRAWAL: 0.05, BRANCH_WITHDRAWAL: 0.20, POS_PURCHASE: 0.10, ONLINE_PURCHASE: 0.05, BANK_TO_MOMO: 0.15, TRANSFER_OUT: 0.35, BILL_PAYMENT: 0.10 }
  # Account the customer transacts through: the first one they hold, in this order.
  operating_account_priority: [CA_BIZ, CA_PER, SA_SUSU, SA_REG]
  # Share of each month's unspent income swept to a regular savings account, if held.
  savings_sweep_share: 0.5
  # Spending (and trader/SME inflow) multiplier by calendar month: Christmas, school fees
  # in January and September, Easter around April.
  seasonality: { 1: 1.10, 2: 0.95, 3: 1.00, 4: 1.05, 5: 0.95, 6: 0.95, 7: 0.95, 8: 1.00, 9: 1.15, 10: 0.95, 11: 1.00, 12: 1.30 }
  # Hour-of-day weights for electronic channels (00:00 to 23:00).
  hour_weights: [1, 0.5, 0.3, 0.3, 0.5, 1, 3, 5, 7, 8, 8, 8, 9, 8, 8, 8, 8, 9, 9, 8, 7, 5, 3, 2]
  # Branch counters are open these hours, Monday to Saturday.
  branch_hours: { open: 8, close: 17 }
  credit_card:
    # Share of eligible card purchases put on the credit card rather than the debit card.
    purchase_share: 0.5
    repayment_day: 15
    pay_full_share: 0.6
    min_payment_pct: 10
  monthly_fee_ghs: { CA_PER: 10, CA_BIZ: 25 }
  counterparty_banks: [Volta Commercial Bank, Ashanti Trust Bank, Coastline Bank, Savannah Savings & Loans, Gold Coast Merchant Bank, Sahel Rural Bank]
  billers: { electricity: 0.35, water: 0.15, pay_tv: 0.20, school_fees: 0.15, insurance: 0.15 }

# ---------------------------------------------------------------- planted signals
# Every signal is probabilistic: labels come from a true probability plus noise, so models
# have something real to find without it being trivially separable.
signals:
  # Illustrative macro-stress index by quarter (1.0 = high stress, e.g. high inflation in
  # early 2023, easing afterwards). Raises default probability for loans opened then.
  macro_stress_by_quarter: { 2023Q1: 1.0, 2023Q2: 0.95, 2023Q3: 0.85, 2023Q4: 0.75, 2024Q1: 0.65, 2024Q2: 0.6, 2024Q3: 0.55, 2024Q4: 0.5, 2025Q1: 0.45, 2025Q2: 0.45, 2025Q3: 0.4, 2025Q4: 0.4, 2026Q1: 0.4, 2026Q2: 0.35, 2026Q3: 0.35, 2026Q4: 0.35 }
  # Stress applied to loans opened before the window.
  pre_window_macro_stress: 0.8

  default:
    # logit(p) = intercept + dti * DTI + stress * macro + income * log(income / median)
    #            + segment effect + N(0, noise_sd)
    intercept: -3.7
    dti: 4.0
    stress: 1.2
    log_income: -0.5
    segment_effect: { civil_servant: -0.6, corporate_employee: -0.3, market_trader: 0.4, susu_saver: 0.3, sme: 0.5 }
    noise_sd: 0.6
    # A defaulting borrower's income falls to this share from a shock date inside the loan.
    shock_income_share: { min: 0.05, max: 0.35 }
    shock_spend_share: 0.6
    # The shock (business loss, medical emergency) takes this share of the operating
    # balance in one large outflow on the shock date.
    shock_balance_drain_share: 0.8
    # Earliest shock: this many months after the loan opens.
    shock_min_months: 2
    # Latest shock, as a share of the loan term (defaults cluster early in a loan's life).
    shock_max_term_share: 0.5

  complaints:
    # Poisson rate per customer per year; categories with weights.
    per_customer_per_year: 0.12
    categories: { failed_transaction: 0.3, card_issue: 0.15, charges_dispute: 0.2, service_quality: 0.2, loan_query: 0.1, fraud_report: 0.05 }
    resolved_share: 0.75
    resolution_days: { min: 1, max: 30 }
    # Share of fraud victims who complain about it (1-5 days after the first fraud event).
    fraud_report_share: 0.7

  churn:
    # Monthly hazard = base[segment] * exp(unresolved_complaint * x + low_activity * y + N(0, noise_sd)).
    base_monthly_hazard: { civil_servant: 0.003, corporate_employee: 0.005, market_trader: 0.004, susu_saver: 0.004, sme: 0.003 }
    unresolved_complaint: 1.6
    low_activity: 0.7
    low_activity_threshold: 0.5
    noise_sd: 0.4
    # Activity and income ramp down over this many months before the churn date.
    ramp_months: { min: 2, max: 6 }
    ramp_floor: 0.2
    # Share of the operating balance moved out in the closing transfer.
    closing_transfer_share: 0.95
    # Earliest churn date: this many months into the window (so the ramp is observable).
    earliest_month: 4

  beneficiaries:
    # Each customer has a few regular payees at other banks.
    per_customer: { min: 1, max: 4 }
    # Share of legitimate transfers to a one-off payee rather than a regular one.
    new_beneficiary_share: 0.1
  devices:
    # Mobile banking devices per enrolled customer.
    per_customer_weights: { 1: 0.8, 2: 0.18, 3: 0.02 }
  legit_night_purchase_share: 0.03

  fraud:
    card_testing:
      monthly_victims_per_1000_cards: 0.6
      probes: { min: 5, max: 15 }
      probe_amount_ghs: { min: 1, max: 10 }
      probe_window_minutes: 60
      cashout_income_multiple: { min: 0.4, max: 1.5 }
    night_geo_jump:
