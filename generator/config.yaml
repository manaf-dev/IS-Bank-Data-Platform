# ---------------------------------------------------------------- customer segments
# Bank-wide archetype mix (sums to 1); branches may override it above.
# monthly_income_ghs: lognormal median and sigma, before the branch income_index is applied.
#   For `sme` this is monthly business turnover rather than personal income.
# income_regularity: 1.0 = same amount on a fixed pay day; lower = more irregular inflows.
# cash_intensity:    share of activity done in cash at the branch rather than electronically.
segments:
  mix:
    civil_servant: 0.20
    corporate_employee: 0.22
    market_trader: 0.28
    susu_saver: 0.18
    sme: 0.12
  archetypes:
    civil_servant:
      customer_type: individual
      monthly_income_ghs: { median: 3500, sigma: 0.35 }
      income_regularity: 0.95
      cash_intensity: 0.25
    corporate_employee:
      customer_type: individual
      monthly_income_ghs: { median: 5500, sigma: 0.55 }
      income_regularity: 0.95
      cash_intensity: 0.15
    market_trader:
      customer_type: individual
      monthly_income_ghs: { median: 2800, sigma: 0.80 }
      income_regularity: 0.30
      cash_intensity: 0.70
    susu_saver:
      customer_type: individual
      monthly_income_ghs: { median: 1500, sigma: 0.60 }
      income_regularity: 0.50
      cash_intensity: 0.75
    sme:
      customer_type: business
      monthly_income_ghs: { median: 30000, sigma: 1.00 }
      income_regularity: 0.40
      cash_intensity: 0.45

# ---------------------------------------------------------------- products
# take_up: probability a customer of that segment holds the product at some point in the
#   window. Segments not listed are not eligible.
products:
  # Deposits
  - product_code: CA_PER
    name: Personal Current Account
    family: deposit
    take_up: { civil_servant: 0.90, corporate_employee: 0.95, market_trader: 0.55, susu_saver: 0.20 }
  - product_code: CA_BIZ
    name: Business Current Account
    family: deposit
    take_up: { market_trader: 0.15, sme: 1.00 }
  - product_code: SA_REG
    name: Regular Savings Account
    family: deposit
    take_up: { civil_servant: 0.55, corporate_employee: 0.60, market_trader: 0.50, susu_saver: 0.40 }
  - product_code: SA_SUSU
    name: Susu Savings Account
    family: deposit
    take_up: { market_trader: 0.30, susu_saver: 0.95 }
  - product_code: FD_TERM
    name: Fixed Deposit (91/182/365 days)
    family: deposit
    take_up: { civil_servant: 0.10, corporate_employee: 0.18, market_trader: 0.05, sme: 0.20 }
  # Cards
  - product_code: DC_DEBIT
    name: Debit Card
    family: card
    take_up: { civil_servant: 0.80, corporate_employee: 0.92, market_trader: 0.40, susu_saver: 0.15, sme: 0.50 }
  - product_code: CC_CLASSIC
    name: Classic Credit Card
    family: card
    take_up: { civil_servant: 0.04, corporate_employee: 0.12, sme: 0.05 }
  # Lending
  - product_code: LN_PERS
    name: Personal Loan
    family: loan
    take_up: { civil_servant: 0.30, corporate_employee: 0.22 }
  - product_code: LN_SALADV
    name: Salary Advance
    family: loan
    take_up: { civil_servant: 0.20, corporate_employee: 0.15 }
  - product_code: LN_MICRO
    name: Trader Micro Loan
    family: loan
    take_up: { market_trader: 0.25, susu_saver: 0.10 }
  - product_code: LN_SME_WC
    name: SME Working Capital Loan
    family: loan
    take_up: { sme: 0.40 }

# Services attached to a customer rather than an account.
services:
  mobile_banking: { civil_servant: 0.60, corporate_employee: 0.80, market_trader: 0.45, susu_saver: 0.25, sme: 0.70 }
  momo_wallet_link: { civil_servant: 0.55, corporate_employee: 0.65, market_trader: 0.70, susu_saver: 0.50, sme: 0.60 }
