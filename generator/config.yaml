# Single source of truth for every generator rate, fraction, noise level, and date window.
# Nothing in generator code may hardcode these values.
#
# Reference data below (branches, segments, products) is a DRAFT for review: see ADR-0002.
# All names are fictional; incomes are rough, illustrative GHS figures, not market data.

seed: 20261019

simulation:
  # Three full calendar years, so each year has its own Christmas, Easter, and
  # school-fees season. After `today`, daily ticks continue from the next day.
  start_date: 2023-01-01
  today: 2025-12-31
  # The world is simulated up to end_date. Everything after `today` is the "future" that
  # daily ticks reveal one day at a time, so a tick is deterministic and idempotent.
  end_date: 2026-12-31
  currency: GHS

# Select with --profile (default: dev). A profile is deep-merged over the base values.
profiles:
  dev:
    customers: { count: 2000 }
  full:
    customers: { count: 50000 }

# ---------------------------------------------------------------- customers
customers:
  count: 2000
  # Share of customers (at branches open before start_date) who joined before the window.
  pre_window_share: 0.60
  earliest_join_date: 2005-01-01
  # Age when the customer (or SME owner) joined: truncated normal.
  age_at_join: { mean: 36, sd: 11, min: 18, max: 80 }
  female_share: 0.48
  email_share: { individual: 0.45, business: 0.90 }
  # Addresses with a numeric suffix, e.g. kwame.mensah84@...
  email_digit_suffix_share: 0.50
  # RFC 2606 reserved domains, so synthetic addresses can never reach a real mailbox.
  email_domains: { example.com: 0.6, example.org: 0.25, example.net: 0.15 }
  mobile_network_share: { MTN: 0.65, Telecel: 0.22, AirtelTigo: 0.13 }
  names:
    # Rank-based popularity: weight of the k-th listed name is 1 / k**exponent.
    popularity_exponent: 0.7
    # Akan customers whose name includes their birth-weekday name.
    akan_day_name_rate: 0.75
    # Of those, the share where the day name is the first name (else the middle name).
    day_name_first_share: 0.45
    # Customers with any middle name at all (day names aside).
    middle_name_rate: 0.35
    # Non-Akan customers whose first name is a common (mostly Christian/English) given name
    # rather than one from their group's own list.
    common_given_share: { ewe: 0.45, ga_dangme: 0.45, northern: 0.15 }
    # SME names of the "<Surname> & Sons" form rather than "<prefix> <trade> <suffix>".
    business_family_firm_share: 0.25
  # Ethnic-group weights by branch region; drives which name lists are sampled.
  ethnicity_by_region:
    Greater Accra: { akan: 0.45, ga_dangme: 0.25, ewe: 0.20, northern: 0.10 }
    Ashanti: { akan: 0.80, ga_dangme: 0.03, ewe: 0.05, northern: 0.12 }
    Western: { akan: 0.80, ga_dangme: 0.05, ewe: 0.08, northern: 0.07 }
    Central: { akan: 0.85, ga_dangme: 0.04, ewe: 0.06, northern: 0.05 }
    Northern: { akan: 0.10, ga_dangme: 0.02, ewe: 0.03, northern: 0.85 }
    Upper East: { akan: 0.05, ga_dangme: 0.01, ewe: 0.02, northern: 0.92 }
    Volta: { akan: 0.10, ga_dangme: 0.04, ewe: 0.82, northern: 0.04 }
    Bono: { akan: 0.82, ga_dangme: 0.01, ewe: 0.03, northern: 0.14 }
    Eastern: { akan: 0.70, ga_dangme: 0.12, ewe: 0.12, northern: 0.06 }

